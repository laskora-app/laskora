{% extends "billing/base.html" %}

{% block title %}Edit Invoice - Laskora{% endblock %}

{% block extra_css %}
<style>
    .page-header{
        margin-bottom:24px;
    }

    .page-title{
        font-size:36px;
        font-weight:800;
        color:#1e293b;
        margin:0;
    }

    .page-subtitle{
        margin-top:10px;
        color:#64748b;
        font-size:15px;
    }

    .form-card{
        background:white;
        border-radius:18px;
        padding:28px;
        box-shadow:0 10px 30px rgba(0,0,0,0.06);
    }

    .grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:20px;
    }

    .full{
        grid-column:1 / -1;
    }

    label{
        display:block;
        font-size:14px;
        margin-bottom:8px;
        color:#475569;
        font-weight:600;
    }

    input, select{
        width:100%;
        padding:14px 16px;
        border:1px solid #dbe2ea;
        border-radius:12px;
        font-size:15px;
        font-family:'Inter', sans-serif;
        background:#ffffff;
        box-sizing:border-box;
        transition:all 0.2s ease;
    }

    input:focus, select:focus{
        outline:none;
        border-color:#3b82f6;
        box-shadow:0 0 0 4px rgba(59,130,246,0.12);
    }

    .actions{
        display:flex;
        gap:12px;
        margin-top:24px;
        flex-wrap:wrap;
    }

    .actions button, .actions a{
        border:none;
        border-radius:10px;
        padding:12px 18px;
        font-weight:700;
        cursor:pointer;
        font-size:14px;
        text-decoration:none;
    }

    .save{
        background:#2563eb;
        color:white;
    }

    .cancel{
        background:#e5e7eb;
        color:#334155;
    }

    @media (max-width: 900px){
        .grid{
            grid-template-columns:1fr;
        }

        .page-title{
            font-size:30px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Edit Invoice</h1>
    <div class="page-subtitle">Update invoice details and save your changes.</div>
</div>

<form method="post">
    {% csrf_token %}

    <div class="form-card">
        <div class="grid">

            <div>
                <label>Client</label>
                <select name="client">
                    {% for client in clients %}
                        <option value="{{ client.id }}" {% if client.id == invoice.client.id %}selected{% endif %}>
                            {{ client }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Invoice number</label>
                <input type="text" name="invoice_number" value="{{ invoice.invoice_number }}">
            </div>

            <div>
                <label>Issue date</label>
                <input type="date" name="issue_date" value="{{ invoice.issue_date|date:'Y-m-d' }}">
            </div>

            <div>
                <label>Due date</label>
                <input type="date" name="due_date" value="{{ invoice.due_date|date:'Y-m-d' }}">
            </div>

            <div>
                <label>Work hours</label>
                <input type="number" step="0.01" name="work_hours" value="{{ invoice.work_hours }}">
            </div>

            <div>
                <label>Hourly rate</label>
                <input type="number" step="0.01" name="hourly_rate" value="{{ invoice.hourly_rate }}">
            </div>

            <div class="full">
                <label>Weeks text</label>
                <input type="text" name="weeks_text" value="{{ invoice.weeks_text }}">
            </div>

            <div>
                <label>VAT / ALV</label>
                <select name="vat_rate">
                    <option value="25.5" {% if invoice.vat_rate == 25.5 %}selected{% endif %}>25.5%</option>
                    <option value="13.5" {% if invoice.vat_rate == 13.5 %}selected{% endif %}>13.5%</option>
                    <option value="0" {% if invoice.vat_rate == 0 %}selected{% endif %}>0%</option>
                </select>
            </div>

        </div>

        <div class="actions">
            <button type="submit" class="save">Update Invoice</button>
            <a href="/invoices/" class="cancel">Cancel</a>
        </div>
    </div>
</form>
{% endblock %}
