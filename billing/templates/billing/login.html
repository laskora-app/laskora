<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Laskora Login</title>
{% load static %}

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#f8fafc;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

.logo-wrap{
    text-align:center;
    margin-bottom:15px;
}

.logo{
    width:220px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

label{
    display:block;
    font-size:14px;
    margin-bottom:6px;
    color:#334155;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #dbe2ea;
    margin-bottom:18px;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.signup{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:#64748b;
}

.signup a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

</style>

</head>

<body>

<div class="card">

<div class="logo-wrap">
    <img src="{% static 'logo/laskora-main.png' %}" class="logo">
</div>
<div class="subtitle">Login to manage your invoices</div>

<form method="post">
{% csrf_token %}

<label>Username</label>
<input type="text" name="username">

<label>Password</label>
<input type="password" name="password">

<button type="submit">Login</button>

</form>

<div class="signup">
Don't have an account? <a href="/signup/">Sign up</a>
</div>

</div>

</body>
</html>
